<div class="page-header">
  <div>
    <h1>Units</h1>
    <p>Manage the units of a building.</p>
  </div>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!selectedBuildingId"
    (click)="openCreate()"
  >
    <mat-icon>add</mat-icon>
    New unit
  </button>
</div>

<div class="filter-bar">
  <mat-form-field appearance="outline">
    <mat-label>Building</mat-label>
    <mat-select [formControl]="buildingControl">
      <mat-option *ngFor="let b of buildings" [value]="b.id">{{ b.name }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

<div class="table-container" *ngIf="selectedBuildingId && units.length > 0">
  <table mat-table [dataSource]="units">
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>Label</th>
      <td mat-cell *matCellDef="let u">{{ u.label }}</td>
    </ng-container>

    <ng-container matColumnDef="assets">
      <th mat-header-cell *matHeaderCellDef>Assets</th>
      <td mat-cell *matCellDef="let u">{{ u.assetCount }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u" class="actions-cell">
        <button mat-icon-button (click)="openEdit(u)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="confirmDelete(u)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<div class="no-data" *ngIf="!isLoading && selectedBuildingId && units.length === 0">
  <mat-icon>meeting_room</mat-icon>
  <p>This building has no units yet.</p>
</div>

<div class="no-data" *ngIf="!selectedBuildingId">
  <mat-icon>domain</mat-icon>
  <p>Select a building to manage its units.</p>
</div>
