<h2 mat-dialog-title>{{ isEdit ? 'Edit unit' : 'New unit' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="unit-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Label</mat-label>
      <input matInput formControlName="label" />
      <mat-error *ngIf="form.controls['label'].hasError('required')">Label is required.</mat-error>
      <mat-error *ngIf="form.controls['label'].hasError('maxlength')">Label is too long.</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="onSubmit()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
