<h2 mat-dialog-title>{{ isEdit ? 'Edit asset type' : 'New asset type' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="type-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.controls['name'].hasError('required')">Name is required.</mat-error>
      <mat-error *ngIf="form.controls['name'].hasError('maxlength')">Name is too long.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Default SLA (hours)</mat-label>
      <input matInput type="number" min="1" formControlName="defaultSlaHours" />
      <mat-error *ngIf="form.controls['defaultSlaHours'].hasError('min')">
        Must be greater than 0.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="onSubmit()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
