<div class="page-header">
  <div>
    <h1>Buildings</h1>
    <p>Manage buildings and their map locations.</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    New building
  </button>
</div>

<div class="filter-bar">
  <mat-form-field appearance="outline">
    <mat-label>Search</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      (keyup.enter)="onSearch()"
      placeholder="Name or address"
    />
  </mat-form-field>
  <div class="filter-actions">
    <button mat-flat-button color="primary" (click)="onSearch()">
      <mat-icon>search</mat-icon>
      Search
    </button>
  </div>
</div>

<mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

<div class="table-container" *ngIf="items.length > 0">
  <table mat-table [dataSource]="items">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let b">{{ b.name }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let b">{{ b.buildingTypeName }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Address</th>
      <td mat-cell *matCellDef="let b">{{ b.address || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="units">
      <th mat-header-cell *matHeaderCellDef>Units</th>
      <td mat-cell *matCellDef="let b">{{ b.unitCount }}</td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let b">
        <span *ngIf="b.latitude != null && b.longitude != null">{{ b.latitude }}, {{ b.longitude }}</span>
        <span *ngIf="b.latitude == null || b.longitude == null">—</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let b" class="actions-cell">
        <button mat-icon-button (click)="openEdit(b)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="confirmDelete(b)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<div class="no-data" *ngIf="!isLoading && items.length === 0">
  <mat-icon>domain</mat-icon>
  <p>No buildings found.</p>
</div>

<mat-paginator
  *ngIf="totalItems > 0"
  [length]="totalItems"
  [pageSize]="pageSize"
  [pageIndex]="currentPage - 1"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
></mat-paginator>
