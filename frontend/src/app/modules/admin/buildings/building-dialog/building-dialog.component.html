<h2 mat-dialog-title>{{ isEdit ? 'Edit building' : 'New building' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="building-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.controls['name'].hasError('required')">Name is required.</mat-error>
      <mat-error *ngIf="form.controls['name'].hasError('maxlength')">Name is too long.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select formControlName="buildingTypeId">
        <mat-option *ngFor="let t of data.buildingTypes" [value]="t.id">{{ t.name }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls['buildingTypeId'].hasError('required')">Type is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <div class="coords">
      <mat-form-field appearance="outline">
        <mat-label>Latitude</mat-label>
        <input matInput type="number" step="any" formControlName="latitude" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Longitude</mat-label>
        <input matInput type="number" step="any" formControlName="longitude" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="onSubmit()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
